name: Chunk Maker v1.4 Patch

on:
  push:
    branches:
      - chunk-maker-v14-select-playtest

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chunk-maker-v14-select-playtest
          fetch-depth: 0

      - name: Apply Chunk Maker v1.4 update
        run: python3 .github/scripts/chunk-maker-v14-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Chunk Maker regression tests
        run: node tests/chunk-maker-tests.cjs

      - name: Full system tests
        run: npm test

      - name: Traversal tests
        run: node tests/procedural-traversal-tests.cjs

      - name: Build standalone bundles
        run: python3 build.py

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/chunk-maker-v14-patch.yml
          rm .github/scripts/chunk-maker-v14-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Chunk Maker select inspector and platforming playtest"
          git push origin HEAD:chunk-maker-v14-select-playtest
