name: Build Neon Descent

on:
  push:
    branches:
      - main
      - feature-ledge-grab-v1
      - feature-polish-controls-generation-v1
      - feature-debug-climb-traps-v1
      - feature-v0-12-movement-hud
      - feature-v0-13-shop-disc-climb
      - feature-v0-14-climb-disc-camera
      - feature-v015-mag-cable
      - feature-v016-grip-pause-camera
      - feature-v017-combat-camera-debug
      - feature-v018-half-blocks-fullscreen
      - feature-chunk-maker-v1
      - feature-chunk-maker-mobile-pan
    paths:
      - 'src/**'
      - 'tools/**'
      - 'index.template.html'
      - 'build.py'
      - 'package.json'
      - 'tests/*.cjs'
      - '.github/workflows/build-neon-descent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check polish patch syntax
        run: |
          node --check src/ledge.js
          node --check src/genpolish.js
          node --check src/v017gen.js
          node --check src/v018geometry.js
          node --check src/grip.js
          node --check src/v014pre.js
          node --check src/v017pre.js
          node --check src/polish.js
          node --check src/v017camera.js
          node --check src/climbpolish.js
          node --check src/trappolish.js
          node --check src/debugtools.js
          node --check src/v013polish.js
          node --check src/v014polish.js
          node --check src/v015polish.js
          node --check src/v016polish.js
          node --check src/v017gameplay.js
          node --check src/v017polish.js
          node --check src/v018polish.js
          node --check src/release.js
      - name: Run system tests
        run: npm test
      - name: Run traversal tests
        run: node tests/traverse.cjs
      - name: Build standalone and Sites bundles
        run: python3 build.py
      - name: Verify v0.18 artifact
        run: |
          test -f Neon-Descent-v0.18.html
          grep -q "const VERSION='0.18'" Neon-Descent-v0.18.html
      - name: Commit generated playable files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Neon-Descent*.html index.html dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build playable Neon Descent v0.18 artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
# Feature-branch validation before main promotion.
