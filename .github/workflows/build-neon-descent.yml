name: Build Neon Descent

on:
  push:
    branches:
      - main
      - feature-ledge-grab-v1
    paths:
      - 'src/**'
      - 'index.template.html'
      - 'build.py'
      - 'package.json'
      - 'tests/*.cjs'
      - '.github/workflows/build-neon-descent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ledge patch syntax
        run: node --check src/ledge.js
      - name: Run system tests
        run: npm test
      - name: Run traversal tests
        run: node tests/traverse.cjs
      - name: Build standalone and Sites bundles
        run: python3 build.py
      - name: Commit generated playable files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Neon-Descent.html index.html dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build playable Neon Descent artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
